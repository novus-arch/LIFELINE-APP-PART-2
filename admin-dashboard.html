<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - LIFELINE</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand-name">L.I.F.E.L.I.N.E.</div>
        <div class="user-controls">
            <span id="welcomeMsg" style="font-size: 14px; opacity: 0.9;"></span>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <div id="tabNavigation" class="tab-navigation"></div>
        <div id="dashboardContent"></div>
        <div id="dashboardError" style="color: red;"></div>
    </div>

    <script src="dashboard-shared.js"></script>
    <script>
        let adminData = {};

        async function loadAdminDashboard() {
            try {
                const response = await fetch('/dashboard/admin');
                const data = await response.json();
                if (data.success) {
                    displayAdminDashboard(data);
                    setupAdminTabs();
                }
                else throw new Error(data.message);
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('dashboardError').textContent = 'Error loading dashboard: ' + err.message;
            }
        }

        function setupAdminTabs() {
            const tabs = ['overview', 'alarms', 'students', 'staffs'];
            let tabHtml = '<div class="tabs">';
            tabs.forEach(tab => {
                const active = currentTab === tab ? 'active' : '';
                tabHtml += `<button class="tab-btn ${active}" onclick="switchTab('${tab}')">${tab.charAt(0).toUpperCase() + tab.slice(1)}</button>`;
            });
            tabHtml += '</div>';
            document.getElementById('tabNavigation').innerHTML = tabHtml;
            showTab('overview');
        }

        function displayAdminDashboard(data) {
            adminData = data;
            setupAdminTabs();
        }

        function showTab(tab) {
            showAdminTab(tab);
        }

        function showAdminTab(tab) {
            let html = '';
            
            if (tab === 'overview') {
                html = '<h2>Admin Overview</h2>';
                html += `<div class="stats-grid">
                            <div class="stat-card"><span>Total Students</span><strong>${adminData.totalStudents}</strong></div>
                            <div class="stat-card"><span>Total Staff</span><strong>${adminData.staffs.length}</strong></div>
                            <div class="stat-card"><span>Active Alarms</span><strong>${adminData.ongoingAlarmCount}</strong></div>
                         </div>`;

                // Ongoing Alarms
                html += '<h3>Ongoing Alarms</h3>';
                html += '<div class="table-container"><table><thead><tr><th>School ID</th><th>Type</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>';
                if (adminData.ongoingAlarms && adminData.ongoingAlarms.length > 0) {
                    adminData.ongoingAlarms.forEach(alarm => {
                        const createdDate = new Date(alarm.createdAt).toLocaleString();
                        const alarmId = alarm.id || alarm._id;
                        html += `<tr><td>${alarm.schoolId}</td><td>${getEmergencyTypeDisplay(alarm.emergency)}</td><td><span style="color:red; font-weight:bold;">${alarm.status}</span></td><td>${createdDate}</td><td><button class="btn-small btn-manage" onclick="resolveAlarm('${alarmId}')">Resolve</button></td></tr>`;
                    });
                } else { html += '<tr><td colspan="5">No active alarms.</td></tr>'; }
                html += '</tbody></table></div>';

                // Emergency Contacts
                html += '<h3>Emergency Contacts</h3>';
                html += '<div class="table-container"><table><thead><tr><th>Student Name</th><th>School ID</th><th>Contact Name</th><th>Contact Number</th></tr></thead><tbody>';
                html += '<tr><td colspan="4" style="text-align: center; color: #999;">No emergency contacts recorded yet.</td></tr>';
                html += '</tbody></table></div>';
            }
            
            else if (tab === 'alarms') {
                html = '<h2>All Alarm Records</h2>';
                html += '<div class="table-container"><table><thead><tr><th>School ID</th><th>Type</th><th>Status</th><th>Created</th><th>Resolved</th><th>Actions</th></tr></thead><tbody>';
                if (adminData.allAlarms && adminData.allAlarms.length > 0) {
                    adminData.allAlarms.forEach(alarm => {
                        const createdDate = new Date(alarm.createdAt).toLocaleString();
                        const resolvedDate = alarm.resolvedAt ? new Date(alarm.resolvedAt).toLocaleString() : '-';
                        const alarmId = alarm.id || alarm._id;
                        html += `<tr>
                                    <td>${alarm.schoolId}</td>
                                    <td>${getEmergencyTypeDisplay(alarm.emergency)}</td>
                                    <td>${alarm.status}</td>
                                    <td>${createdDate}</td>
                                    <td>${resolvedDate}</td>
                                    <td>
                                        <button class="btn-small btn-delete" onclick="deleteRecord('alarm', '${alarmId}')">Delete</button>
                                    </td>
                                </tr>`;
                    });
                } else { html += '<tr><td colspan="6">No alarm records found.</td></tr>'; }
                html += '</tbody></table></div>';
            }
            
            else if (tab === 'students') {
                html = '<h2>Students Management</h2>';
                html += '<div style="display: flex; gap: 30px; align-items: flex-start;">';
                
                // Left side - Create Student Form
                html += '<div style="flex: 0 0 400px;">';
                html += '<h3>Create New Student Account</h3>';
                html += '<div class="form-card">';
                html += '<form id="createStudentForm" onsubmit="createAccount(event, \'student\')">';
                html += '<input type="text" id="studentName" placeholder="Full Name" required />';
                html += '<input type="text" id="studentSchoolId" placeholder="School ID" required />';
                html += '<input type="password" id="studentPassword" placeholder="Password" required />';
                html += '<input type="text" id="studentDept" placeholder="Department (optional)" />';
                html += '<button type="submit" class="btn-create">Create Student</button>';
                html += '</form>';
                html += '<div id="createMessage" style="margin-top: 10px; padding: 10px; display: none; border-radius: 5px;"></div>';
                html += '</div>';
                html += '</div>';
                
                // Right side - Student Directory
                html += '<div style="flex: 1;">';
                html += '<h3>All Students Directory</h3>';
                html += '<div class="table-container"><table><thead><tr><th>Name</th><th>ID</th><th>Department</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
                if (adminData.students && adminData.students.length > 0) {
                    adminData.students.forEach(student => {
                        const status = '<span style="color:green">Active</span>';
                        html += `<tr>
                                    <td>${student.name}</td>
                                    <td>${student.schoolId}</td>
                                    <td>${student.department}</td>
                                    <td>${status}</td>
                                    <td>
                                        <button class="btn-small btn-manage" onclick="showStudentQR('${student.schoolId}')">QR</button>
                                        <button class="btn-small btn-delete" onclick="deleteRecord('student', '${student.schoolId}')">Delete</button>
                                    </td>
                                </tr>`;
                    });
                } else { html += '<tr><td colspan="5">No student records found.</td></tr>'; }
                html += '</tbody></table></div>';
                html += '</div>';
                html += '</div>';
            }
            
            else if (tab === 'staffs') {
                html = '<h2>Staff Management</h2>';
                html += '<div style="display: flex; gap: 30px; align-items: flex-start;">';
                
                // Left side - Create Staff Form
                html += '<div style="flex: 0 0 400px;">';
                html += '<h3>Create New Staff Account</h3>';
                html += '<div class="form-card">';
                html += '<form id="createStaffForm" onsubmit="createAccount(event, \'staff\')">';
                html += '<input type="text" id="staffName" placeholder="Full Name" required />';
                html += '<input type="text" id="staffSchoolId" placeholder="School ID" required />';
                html += '<input type="password" id="staffPassword" placeholder="Password" required />';
                html += '<input type="text" id="staffDept" placeholder="Department (optional)" />';
                html += '<button type="submit" class="btn-create">Create Staff</button>';
                html += '</form>';
                html += '<div id="createMessage" style="margin-top: 10px; padding: 10px; display: none; border-radius: 5px;"></div>';
                html += '</div>';
                html += '</div>';
                
                // Right side - Staff Directory
                html += '<div style="flex: 1;">';
                html += '<h3>All Staff Directory</h3>';
                html += '<div class="table-container"><table><thead><tr><th>Name</th><th>ID</th><th>Department</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
                if (adminData.staffs && adminData.staffs.length > 0) {
                    adminData.staffs.forEach(staff => {
                        const status = '<span style="color:green">Active</span>';
                        html += `<tr>
                                    <td>${staff.name}</td>
                                    <td>${staff.schoolId}</td>
                                    <td>${staff.department}</td>
                                    <td>${status}</td>
                                    <td>
                                        <button class="btn-small btn-delete" onclick="deleteRecord('staff', '${staff.schoolId}')">Delete</button>
                                    </td>
                                </tr>`;
                    });
                } else { html += '<tr><td colspan="5">No staff records found.</td></tr>'; }
                html += '</tbody></table></div>';
                html += '</div>';
                html += '</div>';
            }
            
            document.getElementById('dashboardContent').innerHTML = html;
        }

        async function createAccount(event, type) {
            event.preventDefault();
            
            let name, schoolId, password, department;
            
            if (type === 'student') {
                name = document.getElementById('studentName').value;
                schoolId = document.getElementById('studentSchoolId').value;
                password = document.getElementById('studentPassword').value;
                department = document.getElementById('studentDept').value || 'General';
            } else if (type === 'staff') {
                name = document.getElementById('staffName').value;
                schoolId = document.getElementById('staffSchoolId').value;
                password = document.getElementById('staffPassword').value;
                department = document.getElementById('staffDept').value || 'General';
            }

            const endpoint = type === 'student' ? `/dashboard/student/${schoolId}` : `/dashboard/staff/${schoolId}`;
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: name,
                        password: password,
                        authority: authority,
                        department: department
                    })
                });

                const data = await response.json();
                const messageDiv = document.getElementById('createMessage');

                if (data.success) {
                    messageDiv.style.backgroundColor = '#d4edda';
                    messageDiv.style.color = '#155724';
                    messageDiv.textContent = `✓ ${data.message}`;
                    messageDiv.style.display = 'block';
                    
                    if (type === 'student') {
                        document.getElementById('createStudentForm').reset();
                    } else {
                        document.getElementById('createStaffForm').reset();
                    }
                    
                    setTimeout(loadAdminDashboard, 2000);
                } else {
                    messageDiv.style.backgroundColor = '#f8d7da';
                    messageDiv.style.color = '#721c24';
                    messageDiv.textContent = `✗ ${data.message}`;
                    messageDiv.style.display = 'block';
                }
            } catch (err) {
                const messageDiv = document.getElementById('createMessage');
                messageDiv.style.backgroundColor = '#f8d7da';
                messageDiv.style.color = '#721c24';
                messageDiv.textContent = `✗ Error: ${err.message}`;
                messageDiv.style.display = 'block';
            }
        }

        async function deleteRecord(type, identifier) {
            if (!confirm(`Are you sure you want to delete this ${type}? This action cannot be undone.`)) {
                return;
            }

            try {
                let endpoint = '';
                
                if (type === 'alarm') {
                    endpoint = `/alarm/${identifier}`;
                } else if (type === 'student') {
                    endpoint = `/student/${identifier}`;
                } else if (type === 'staff') {
                    endpoint = `/staff/${identifier}`;
                }

                const response = await fetch(endpoint, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        authority: authority
                    })
                });

                const data = await response.json();

                if (data.success) {
                    alert(`✓ ${data.message}`);
                    loadAdminDashboard();
                } else {
                    alert(`✗ Error: ${data.message}`);
                }
            } catch (err) {
                alert(`✗ Error: ${err.message}`);
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            
            // Update active button
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            showAdminTab(tabName);
        }

        async function resolveAlarm(alarmId) {
            if (confirm('Are you sure you want to resolve this alarm?')) {
                try {
                    const response = await fetch(`/alarm/${alarmId}/resolve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            authority: authority
                        })
                    });

                    const data = await response.json();
                    if (data.success) {
                        alert('Alarm resolved successfully!');
                        loadAdminDashboard();
                    } else {
                        alert('Failed to resolve alarm: ' + data.message);
                    }
                } catch (err) {
                    alert('Error resolving alarm: ' + err.message);
                }
            }
        }

        function showStudentQR(schoolId) {
            const qrUrl = `https://lifeline-app-part-2.onrender.com/alarm.html?schoolId=${schoolId}`;
            const qrHtml = `
                <div style="padding: 20px; text-align: center;">
                    <h3>Student QR Code</h3>
                    <p><strong>School ID:</strong> ${schoolId}</p>
                    <div id="qrContainer" style="margin: 20px 0;"></div>
                    <p style="font-size: 12px; color: #666; margin-top: 10px; word-break: break-all;">
                        ${qrUrl}
                    </p>
                    <button class="btn-create" onclick="this.parentElement.parentElement.remove()">Close</button>
                </div>
            `;
            
            const modal = document.createElement('div');
            modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;';
            modal.innerHTML = `<div style="background: white; padding: 30px; border-radius: 10px; max-width: 500px; width: 90%;">${qrHtml}</div>`;
            document.body.appendChild(modal);
            
            setTimeout(() => generateQRCode(qrUrl, 'qrContainer'), 100);
        }

        window.addEventListener('load', loadAdminDashboard);
    </script>
</body>
</html>
