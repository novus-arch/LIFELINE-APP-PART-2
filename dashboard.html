<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LIFELINE</title>
</head>
<body>
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #f4f6f9;">
        <div style="text-align: center;">
            <h1 style="color: #800000; margin-bottom: 20px;">L.I.F.E.L.I.N.E.</h1>
            <p style="color: #666; font-size: 16px;">Loading your dashboard...</p>
            <div style="margin-top: 20px;">
                <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #800000; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
            </div>
        </div>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        const username = localStorage.getItem('username');
        const authority = localStorage.getItem('authority');

        if (!username || !authority) {
            window.location.href = '/index.html';
        } else {
            // Route to appropriate dashboard based on authority
            switch(authority) {
                case 'ADMIN':
                    window.location.href = '/admin-dashboard.html';
                    break;
                case 'STAFF':
                    window.location.href = '/staff-dashboard.html';
                    break;
                case 'STUDENT':
                    window.location.href = '/student-dashboard.html';
                    break;
                default:
                    window.location.href = '/index.html';
            }
        }
    </script>
</body>
</html>
